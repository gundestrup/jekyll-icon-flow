name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.leg.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        leg:
          # Each leg carries its own committed lockfile so bundler-cache can
          # install frozen everywhere; leg Gemfiles omit RuboCop (its
          # unicode-display_width can't resolve with pre-4.3 terminal-table).
          - { name: "Jekyll ~> 4.0.0", gemfile: "gemfiles/jekyll_40.gemfile" }
          - { name: "Jekyll ~> 4.2.0", gemfile: "gemfiles/jekyll_42.gemfile" }
          - { name: "Jekyll latest", gemfile: "Gemfile" }
    env:
      BUNDLE_GEMFILE: ${{ matrix.leg.gemfile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Semgrep
        if: matrix.leg.gemfile == 'Gemfile'
        run: pipx install semgrep==1.182.0

      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update

      - name: Run checks
        run: |
          if [ "$BUNDLE_GEMFILE" = "Gemfile" ]; then
            bundle exec rake ci
          else
            bundle exec rake test
          fi

      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4' && matrix.leg.gemfile == 'Gemfile'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: SonarQube Cloud scan
        if: matrix.ruby == '3.4' && matrix.leg.gemfile == 'Gemfile'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep security scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
