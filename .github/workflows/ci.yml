name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Jekyll ${{ matrix.jekyll }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        jekyll: ["~> 4.0.0", "~> 4.2.0", "latest"]
    env:
      # Pinned legs resolve that Jekyll minor and run test-only: RuboCop's
      # unicode-display_width >= 2.4 can't resolve with pre-4.3 terminal-table.
      JEKYLL_VERSION: ${{ matrix.jekyll != 'latest' && matrix.jekyll || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # bundler-cache runs `bundle install` frozen — the committed lockfile
          # doesn't match pinned legs' env-gated Gemfile, so they install
          # unfrozen below and resolve fresh.
          bundler-cache: ${{ matrix.jekyll == 'latest' }}

      - name: Install dependencies
        if: matrix.jekyll != 'latest'
        run: bundle install

      - name: Install Semgrep
        if: matrix.jekyll == 'latest'
        run: pipx install semgrep==1.182.0

      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update

      - name: Run checks
        run: |
          if [ -n "$JEKYLL_VERSION" ]; then
            bundle exec rake test
          else
            bundle exec rake ci
          fi

      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4' && matrix.jekyll == 'latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: SonarQube Cloud scan
        if: matrix.ruby == '3.4' && matrix.jekyll == 'latest'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep security scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
