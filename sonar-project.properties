# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-icon-flow
sonar.projectName=jekyll-icon-flow

sonar.sources=.
sonar.test.inclusions=test/**
sonar.exclusions=assets/icons/**,coverage/**,vendor/**,pkg/**

# SimpleCov JSON report emitted by test_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json
# tasks/docs-demo.html.erb generates docs/assets/demo.html — counting both
# flags the generated copy as duplicated code.
sonar.cpd.exclusions=docs/assets/demo.html
