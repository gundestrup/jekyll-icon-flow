AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3

plugins:
  - rubocop-minitest

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 100

# Bundler-style hyphenated gem entrypoint
Naming/FileName:
  Exclude:
    - lib/jekyll-icon-flow.rb

Metrics/AbcSize:
  Exclude:
    - test/**/*

Metrics/BlockLength:
  Exclude:
    - test/**/*

Metrics/ClassLength:
  Exclude:
    - test/**/*

Metrics/CyclomaticComplexity:
  Exclude:
    - test/**/*

Metrics/MethodLength:
  Exclude:
    - test/**/*

Metrics/PerceivedComplexity:
  Exclude:
    - test/**/*

Minitest/MultipleAssertions:
  Enabled: false
